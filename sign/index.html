<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>signin</title>

    <style>
        @media screen and (max-width:1245px) {
            .submit {
                flex-direction: column;
                text-align: center;


            }
        }

        .xyz {
            background-color: transparent;

        }
    </style>
</head>

<body>

    <div
        class=" container text-start  border w-50 position-absolute top-50 start-50 translate-middle  bg-info  shadow-lg  text-light">
        <h1 class="text-center fs-1 fw-bolder">Sign Up</h1>
        <label for="Name">FullName</label>

        <input type="text"
            class="form-control  xyz   mb-4 border-top-0 border-end-0 border-start-0 border-bottom border-light"
            placeholder="Name... ">

        <label class="form-label" for="Email">Email</label>

        <input type="email"
            class="form-control  mb-4 border-top-0 border-end-0 border-start-0 border-bottom border-light xyz"
            placeholder="Email address...">


        <label for="Username">Username</label>
        <input type="text"
            class="form-control  mb-4 border-top-0 border-end-0 border-start-0 border-bottom border-light xyz"
            placeholder="Username...">

        <label for="Password">Password</label>
        <input type="password"
            class="form-control  mb-4 border-top-0 border-end-0 border-start-0 border-bottom border-light xyz"
            placeholder="************">

        <label for=" Repeat Password">Repeat Password</label>
        <input type="password"
            class="form-control  mb-4 border-top-0 border-end-0 border-start-0 border-bottom border-light xyz"
            placeholder="************">


        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" value="">
            <label class="form-check-label" for="flexCheckChecked">
                I agree to the Terms of User
            </label>
        </div>

        <div class="submit d-flex">
            <div class="button btn-primary rounded-pill p-2 px-5 mb-3 ">SignUp</div>

            <div class="button rounded-pill p-2 px-5 border mb-3  ms-2">Signin</div>
        </div>
    </div>












    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>


</body>

</html>
